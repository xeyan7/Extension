<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UI Copier verification fixture</title>
  <link rel="stylesheet" href="../content.css">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; color: #1d2621; background: #f0eee7; font-family: Georgia, serif; }
    .fixture-nav { display: flex; align-items: center; justify-content: space-between; padding: 24px 7vw; }
    .fixture-nav a { color: inherit; text-decoration: none; }
    .fixture-hero { display: grid; grid-template-columns: 1.2fr .8fr; gap: 48px; min-height: 70vh; padding: 8vh 7vw; background: linear-gradient(140deg, #f0eee7, #dce8df); }
    .fixture-hero h1 { max-width: 650px; margin: 0; font-size: clamp(48px, 8vw, 112px); line-height: .88; letter-spacing: -.06em; }
    .fixture-hero p { max-width: 500px; font: 20px/1.6 Arial, sans-serif; }
    .fixture-card { align-self: end; padding: 30px; color: white; background: #315d4c; border-radius: 24px; box-shadow: 0 24px 60px rgba(49,93,76,.22); }
    .fixture-card button { padding: 12px 18px; color: #1d2621; background: #fff; border: 0; border-radius: 8px; font-weight: 700; }
    .fixture-card button:hover { transform: translateY(-1px); }
    .fixture-icon { width: 42px; height: 42px; fill: none; stroke: currentColor; stroke-width: 1.5; }
    @media (max-width: 720px) { .fixture-hero { grid-template-columns: 1fr; } .fixture-card { margin-top: 20px; } }
  </style>
</head>
<body>
  <nav class="fixture-nav"><strong>Field Notes</strong><a href="#story">Read the story</a></nav>
  <main class="fixture-hero" id="story">
    <section>
      <svg class="fixture-icon" viewBox="0 0 48 48" aria-label="Compass"><circle cx="24" cy="24" r="19"/><path d="m29 18-3 8-8 3 3-8z"/></svg>
      <h1>Design found in the wild.</h1>
      <p>Use this fixture to verify component selection, generated markup, typography, colors, gradients, SVG extraction, and responsive behavior.</p>
    </section>
    <article class="fixture-card">
      <small>EXPEDITION 04</small>
      <h2>Coastal systems</h2>
      <p>Interfaces shaped by weather, distance, and useful restraint.</p>
      <button type="button">Open field guide</button>
    </article>
  </main>
  <script>
    (() => {
      const listeners = [];
      let saved = [];
      window.chrome = {
        runtime: {
          id: 'fixture-runtime',
          getURL(path) { return new URL('../' + path, location.href).href; },
          onMessage: { addListener(fn) { listeners.push(fn); }, removeListener(fn) { const i = listeners.indexOf(fn); if (i >= 0) listeners.splice(i, 1); } },
          async sendMessage(message, callback) {
            let response = { success: true };
            if (message.action === 'getComponents') response = { success: true, components: saved };
            if (message.action === 'saveComponent') { saved.unshift({ id: String(Date.now()), ...message.component }); response = { success: true }; }
            if (message.action === 'deleteComponent') { saved = saved.filter(item => item.id !== message.id); response = { success: true, components: saved }; }
            if (message.action === 'getNetworkAssets') response = { images: [], videos: [], audio: [], fonts: [], scripts: [], other: [] };
            if (message.action === 'fetchExternalStylesheets') response = { success: true, results: {} };
            if (callback) callback(response);
            return response;
          }
        }
      };
    })();
  </script>
  <script src="../lib/gsap.min.js"></script>
  <script src="../lib/tailwind-lib.js"></script>
  <script src="../lib/extractor.js"></script>
  <script src="../content.js"></script>
  <script>
    const fixtureView = new URLSearchParams(location.search).get('view');
    if (fixtureView === 'assets') {
      window.uicc.handleBarClick('assets');
      window.uicc.toolbarTimeline?.progress(1);
    }
    if (fixtureView === 'profile') {
      window.uicc.handleBarClick('profile');
      window.uicc.toolbarTimeline?.progress(1);
    }
    if (fixtureView === 'selected') {
      window.uicc.selectedElement = document.querySelector('.fixture-card');
      window.uicc.setActiveButton('selector');
      window.uicc.showSelectedComponent();
      // Complete the cosmetic transition so deterministic screenshots capture
      // the final panel state instead of an arbitrary animation frame.
      window.uicc.toolbarTimeline?.progress(1);
    }
    if (fixtureView === 'export') {
      const target = document.querySelector('.fixture-card');
      const directionContext = document.createElement('div');
      directionContext.style.cssText = 'position:fixed;left:-9999px;direction:rtl;writing-mode:vertical-rl';
      directionContext.innerHTML = '<div class="fixture-direction-target"><span>First</span><span>Second</span></div>';
      document.body.appendChild(directionContext);
      const directionTarget = directionContext.firstElementChild;
      Promise.all([
        window.uicc.generateHTMLCSS(target),
        window.uicc.generateTailwind(target),
        window.uicc.generateVueSFC(target),
        window.uicc.generateReactJSX(target)
      ]).then(async ([html, tailwind, vue, react]) => {
        const directional = await window.uicc.generateHTMLCSS(directionTarget);
        const checks = [
          html.includes('<!-- HTML -->') && html.includes('<style>') && html.includes('@media (max-width: 720px)') && html.includes(':hover'),
          /class="[^"]*(?:bg-|text-|p-|m-|rounded-|shadow-|grid|flex)/.test(tailwind) && !tailwind.includes('<!-- HTML -->'),
          vue.includes('<template>') && vue.includes('<style scoped>'),
          react.includes('export default function CopiedComponent') && react.includes('className=') && react.includes('<style>{styles}</style>'),
          directional.includes('direction: rtl') && directional.includes('writing-mode: vertical-rl') && directional.indexOf('First') < directional.indexOf('Second')
        ];
        directionContext.remove();
        document.body.dataset.exportStatus = checks.every(Boolean) ? 'pass' : 'fail';
        document.body.dataset.exportLengths = [html.length, tailwind.length, vue.length, react.length].join(',');
        const badge = document.createElement('output');
        badge.id = 'export-status';
        badge.textContent = `${document.body.dataset.exportStatus.toUpperCase()} · ${checks.map(Number).join('')} · ${document.body.dataset.exportLengths}`;
        badge.style.cssText = 'position:fixed;left:20px;bottom:20px;z-index:999999;padding:12px 16px;color:white;background:#315d4c;border-radius:8px;font:700 14px Arial';
        document.body.appendChild(badge);
      }).catch(error => {
        document.body.dataset.exportStatus = 'error';
        document.body.dataset.exportError = error.message;
        const badge = document.createElement('output');
        badge.id = 'export-status';
        badge.textContent = `ERROR · ${error.message}`;
        document.body.appendChild(badge);
      });
    }
  </script>
</body>
</html>
